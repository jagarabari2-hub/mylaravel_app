<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Gear -->
  <g fill="#e2e8f0">
    <circle cx="32" cy="26" r="11"/>
    <g>
      <rect x="30" y="8" width="4" height="6"/>
      <rect x="30" y="38" width="4" height="6"/>
      <rect x="8" y="24" width="6" height="4"/>
      <rect x="50" y="24" width="6" height="4"/>
      <rect x="14" y="14" width="5" height="3" transform="rotate(-45 16 15)"/>
      <rect x="45" y="14" width="5" height="3" transform="rotate(45 47 15)"/>
      <rect x="14" y="39" width="5" height="3" transform="rotate(45 16 40)"/>
      <rect x="45" y="39" width="5" height="3" transform="rotate(-45 47 40)"/>
    </g>
  </g>

  <!-- People -->
  <circle cx="24" cy="26" r="4" fill="#3b82f6"/>
  <circle cx="40" cy="26" r="4" fill="#3b82f6"/>
  <circle cx="32" cy="23" r="5" fill="url(#accent)"/>

  <!-- Clipboard -->
  <rect x="36" y="36" width="18" height="18" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="40" y="34" width="10" height="4" rx="2" fill="#94a3b8"/>

  <!-- Check -->
  <path d="M40 45 L45 50 L52 41" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chart -->
  <rect x="10" y="44" width="4" height="8" fill="#f97316"/>
  <rect x="16" y="40" width="4" height="12" fill="#facc15"/>
  <rect x="22" y="36" width="4" height="16" fill="#22c55e"/>
</svg>
